{% extends "base.html" %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
    <div class="records-card" style="padding: 32px 28px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="logo-mark" style="margin: 0 auto 12px auto; width: 44px; height: 44px; font-size: 16px;">BT</div>
            <h2 style="font-size: 20px; font-weight: 700; color: var(--text-navy-primary);">Operator Sign In</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
                BharatTrip Refund Intelligence Operations Portal
            </p>
        </div>

        {% if error_message %}
        <div class="alert-box alert-danger" style="margin-bottom: 18px;">
            <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <div>{{ error_message }}</div>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login_action') }}" style="display: flex; flex-direction: column; gap: 16px;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input type="hidden" name="next" value="{{ next_url or '' }}"/>

            <div class="form-group">
                <label for="username" class="form-label">Operator Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="filter-input" 
                    style="width: 100%; height: 40px;" 
                    placeholder="Enter operator username"
                    required
                    autofocus
                />
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="filter-input" 
                    style="width: 100%; height: 40px;" 
                    placeholder="Enter operator password"
                    required
                />
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; height: 40px; justify-content: center; font-size: 14px; margin-top: 8px;">
                Authenticate & Access Console
            </button>
        </form>

        <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-subtle); font-size: 11.5px; color: var(--text-muted); text-align: center;">
            Authorized access only. All actions and reviews are logged.
        </div>
    </div>
</div>
{% endblock %}
